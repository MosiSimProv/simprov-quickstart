# Entity Specifications
# see https://js.cytoscape.org for Details
Assumption:
  attributes:
    - File Path*
    - Content
  style:
    background-color: "#c59ee2"
    border-width: 2
    border-style: "solid"
    border-color: "#7031a0"


Reference:
  attributes:
    - File Path*
    - Content
  style:
    font-size: 14
    background-color: "#e9ddaf"
    border-width: 2
    border-style: "solid"
    border-color: "#ddcb86"

Requirement:
  attributes:
    - File Path*
    - Content
  style:
    background-color: "#c5e0b4"
    border-width: 2
    border-style: "solid"
    border-color: "#a9d18e"

Research Question:
  attributes:
    - File Path*
    - Content
  style:
    background-color: "#ff6a6a"
    border-width: 2
    border-style: "solid"
    border-color: "#ff0101"

Simulation Model:
  attributes:
    - File Path*
    - Content
  style:
    background-color: "#bdd7ee"
    border-width: 2
    border-style: "solid"
    border-color: "#2f75b6"

Simulation Experiment:
  attributes:
    - File Path*
    - Content
  style:
    font-size: 14
    background-color: "#f4b183"
    border-width: 2
    border-style: "solid"
    border-color: "#cc6823"

Simulation Data:
  attributes:
    - File Path*
  style:
    background-color: "#ffd967"
    border-width: 2
    border-style: "solid"
    border-color: "#f4b183"

Validation Result:
  attributes:
    - File Path*
    - Content

Analysis Result:
  attributes:
    - File Path*
    - Content

Script:
  attributes:
    - Hash*
    - File Path
    - Content
  style:
    background-color: "#9fffa5"
    border-width: 2
    border-style: "solid"
    border-color: "#06df14"

Visualization:
  attributes:
    - File Path*
    - Content
  style:
    background-color: "#9ffdff"
    border-width: 2
    border-style: "solid"
    border-color: "#06abdf"

Validation Report:
  attributes:
    - File Path*
    - Content


#DONE
Specifying Assumption:
  usage:
    - Reference*
    - Assumption?
  generation:
    - Assumption

# Requirement: Anforderungen an Ausgaben an die Simulation (e.g. Peak at 3h)
# Might be data or logic or smth else
#DONE
Specifying Requirement:
  usage:
    - Reference*
    - Requirement?
  generation:
    - Requirement

#DONE
Specifying Research Question:
  usage:
    - Reference*
    - Research Question?
  generation:
    - Research Question

#Done
Specifying Reference:
  usage:
    - Reference?
  generation:
    - Reference

#Done
Specifying Simulation Model:
  usage:
    - Simulation Model*
    - Assumption*
    - Requirement*
    - Research Question?
  generation:
    - Simulation Model

#Done
Specifying Simulation Experiment:
  usage:
    - Requirement*
    - Assumption*
    - Simulation Model
    - Simulation Experiment?
  generation:
    - Simulation Experiment
  style:
    font-size: 16

#Done
Executing Simulation Experiment:
  usage:
    - Simulation Experiment
  generation:
    - Simulation Data*

# todo: also the annotation stuff + naming convention for this script
Analyzing Simulation Data:
  usage:
    - Simulation Data+
    - Requirement*
    - Analysis Result*
    - Assumption*
    - Script
  generation:
    - Visualization?
    - Analysis Result?

# This is included in the documentation
Face-Validation:
  usage:
    - Visualization
    - Requirement+
  generation:
    - Validation Report

